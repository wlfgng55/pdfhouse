<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfaları Döndür – PDF Stüdyo</title>
<meta name="description" content="PDF sayfalarını sağa veya sola çevir, doğru yönde kaydet. Her şey tarayıcında yapılır.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%235b3df5%27/%3E%3Ctext x=%2750%27 y=%2768%27 font-size=%2760%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27Arial%27 font-weight=%27700%27%3EP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  :root {
    --bg: #e4e8f0; --panel: #ffffff; --ink: #141a2e; --muted: #667085; --line: #d5d9e3;
    --accent: #5b3df5; --accent-ink: #ffffff; --accent-soft: #f0edff;
    --danger: #d92d20;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1020; --panel: #171b30; --ink: #eef0fb; --muted: #98a0bd; --line: #2a3050;
      --accent: #9b8cff; --accent-ink: #0d1020; --accent-soft: #292442;
      --danger: #ff8f84;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column;
  }
  button { font: inherit; color: inherit; }
  button:focus-visible, .drop:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }

  .bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
  }
  .logo { font-weight: 800; letter-spacing: -.02em; margin-right: 4px; text-decoration: none; color: inherit; }
  .logo b { color: var(--accent); }
  .btn, .go {
    border: 1.5px solid var(--line); background: transparent; border-radius: 9px;
    padding: 7px 13px; cursor: pointer; font-weight: 600; text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover:not(:disabled) { border-color: var(--ink); }
  .go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 800; }
  .go:disabled, .btn:disabled { opacity: .42; cursor: default; }
  .sp { flex: 1; }
  .meta { color: var(--muted); font-size: .9rem; font-weight: 600; font-variant-numeric: tabular-nums; }

  .wrap { flex: 1; max-width: 1200px; width: 100%; margin: 0 auto; padding: 24px 20px 56px; }

  .batch-bar {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    margin-bottom: 18px;
  }
  .batch-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px;
    padding: 12px; display: flex; flex-direction: column; gap: 10px;
  }
  .card-top {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: .88rem; font-weight: 700;
  }
  .angle-pill {
    font-size: .76rem; font-weight: 800; padding: 3px 8px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); font-variant-numeric: tabular-nums;
  }
  .thumb-box {
    background: var(--bg); border-radius: 8px; padding: 10px;
    display: grid; place-items: center; min-height: 220px; overflow: hidden;
  }
  .thumb-box canvas {
    max-width: 165px; max-height: 195px; width: auto; height: auto;
    background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.18); border-radius: 2px;
    transition: transform .2s ease;
  }
  .rot-row {
    display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px;
  }
  .rot-btn {
    border: 1.5px solid var(--line); background: transparent; border-radius: 8px;
    padding: 6px 8px; cursor: pointer; font-weight: 700; font-size: .82rem;
  }
  .rot-btn:hover { border-color: var(--accent); background: var(--accent-soft); }

  #empty { max-width: 560px; margin: 36px auto; }
  #empty h1 {
    font-size: clamp(1.9rem, 5vw, 2.8rem); line-height: 1.06; letter-spacing: -.03em;
    font-weight: 800; margin: 0 0 10px;
  }
  #empty p { color: var(--muted); margin: 0 0 22px; font-size: 1.02rem; }
  .drop {
    display: block; border: 2px dashed var(--muted); border-radius: 16px; padding: 42px 20px;
    text-align: center; cursor: pointer; background: var(--panel); transition: border-color .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); }
  .drop strong { display: block; font-size: 1.12rem; margin-bottom: 4px; }
  .drop small { color: var(--muted); }
  .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px;
    font-weight: 600; z-index: 30; max-width: 90vw;
  }
  #toast.err { background: var(--danger); color: #fff; }
</style>
</head>
<body>

<header class="bar">
  <a class="btn" href="index.html">← Ana sayfa</a>
  <a class="logo" href="sayfalari-dondur.html">PDF<b>Stüdyo</b> · Sayfaları Döndür</a>
  <button class="btn" id="openBtn">PDF Aç</button>
  <button class="btn" id="resetBtn" disabled>Sıfırla</button>
  <span class="sp"></span>
  <span class="meta" id="pageCount">–</span>
  <button class="go" id="saveBtn" disabled>Kaydet ve İndir</button>
</header>

<main class="wrap">
  <div id="empty">
    <h1>PDF sayfalarını doğru yöne çevir.</h1>
    <p>Sayfaları tek tek veya toplu olarak sola ya da sağa döndürüp kaydet. Dosyan tarayıcıdan çıkmaz.</p>
    <label class="drop" id="drop">
      <input type="file" id="fileInput" accept="application/pdf,.pdf">
      <strong>PDF dosyasını buraya bırak</strong>
      <small>ya da tıklayıp bilgisayarından seç</small>
    </label>
  </div>

  <div id="workArea" hidden>
    <div class="batch-bar">
      <span class="meta" id="hintInfo">Her sayfa kendi açısını korur; kaydettiğinde PDF’e işlenir.</span>
      <div class="batch-actions">
        <button class="btn" id="allLeftBtn">↺ Tümünü 90° Sola</button>
        <button class="btn" id="allRightBtn">↻ Tümünü 90° Sağa</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</main>

<div id="toast" hidden></div>

<script>
  if (typeof pdfjsLib === "undefined" || typeof PDFLib === "undefined") {
    document.querySelector(".wrap").innerHTML = "<h2>Kütüphaneler yüklenemedi</h2><p>İnternet bağlantını kontrol et.</p>";
    throw new Error("Kütüphaneler yüklenemedi");
  }

  const { PDFDocument, degrees } = PDFLib;
  const $ = (id) => document.getElementById(id);
  const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  const workerReady = fetch(PDFJS + "pdf.worker.min.js")
    .then((r) => r.text())
    .then((t) => {
      pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([t], { type: "text/javascript" }));
    })
    .catch(() => {
      pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js";
    });

  const state = {
    bytes: null,
    doc: null,
    name: "belge",
    baseRotations: [], // Orijinal PDF sayfa açıları (0, 90, 180, 270)
    addedRotations: [] // Kullanıcının eklediği açı (0, 90, 180, 270)
  };

  function toast(msg, isErr = false) {
    const t = $("toast");
    t.textContent = msg;
    t.className = isErr ? "err" : "";
    t.hidden = false;
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { t.hidden = true; }, 3200);
  }

  function normAngle(deg) {
    return ((deg % 360) + 360) % 360;
  }

  $("openBtn").onclick = () => $("fileInput").click();
  $("fileInput").onchange = (e) => {
    const f = e.target.files[0];
    e.target.value = "";
    if (f) openPdf(f);
  };

  const drop = $("drop");
  ["dragenter", "dragover"].forEach((ev) =>
    drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); })
  );
  ["dragleave", "drop"].forEach((ev) =>
    drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); })
  );
  drop.addEventListener("drop", (e) => {
    const f = e.dataTransfer.files[0];
    if (f) openPdf(f);
  });

  async function openPdf(file) {
    if (file.type !== "application/pdf" && !/\.pdf$/i.test(file.name)) {
      toast("Lütfen geçerli bir PDF dosyası seç.", true);
      return;
    }
    try {
      await workerReady;
      const bytes = await file.arrayBuffer();
      const pdfLibDoc = await PDFDocument.load(bytes);
      const baseRotations = pdfLibDoc.getPages().map((p) => normAngle(p.getRotation().angle));

      state.bytes = bytes;
      state.doc = await pdfjsLib.getDocument({ data: new Uint8Array(bytes).slice() }).promise;
      state.name = file.name.replace(/\.pdf$/i, "") || "belge";
      state.baseRotations = baseRotations;
      state.addedRotations = new Array(state.doc.numPages).fill(0);

      $("empty").hidden = true;
      $("workArea").hidden = false;
      $("saveBtn").disabled = false;
      $("resetBtn").disabled = false;
      $("pageCount").textContent = `${state.doc.numPages} sayfa`;

      await renderGrid();
    } catch (err) {
      toast("PDF açılamadı. Dosya bozuk veya şifreli olabilir.", true);
    }
  }

  function applyCardVisual(card, idx) {
    const added = state.addedRotations[idx] || 0;
    const total = normAngle((state.baseRotations[idx] || 0) + added);
    const badge = card.querySelector(".angle-pill");
    const cv = card.querySelector("canvas");
    badge.textContent = `${total}°`;
    if (cv) {
      cv.style.transform = `rotate(${added}deg)`;
    }
  }

  function rotatePage(idx, delta) {
    state.addedRotations[idx] = normAngle((state.addedRotations[idx] || 0) + delta);
    const card = $("grid").children[idx];
    if (card) applyCardVisual(card, idx);
  }

  $("allLeftBtn").onclick = () => {
    state.addedRotations = state.addedRotations.map((a) => normAngle(a - 90));
    [...$("grid").children].forEach((c, i) => applyCardVisual(c, i));
  };

  $("allRightBtn").onclick = () => {
    state.addedRotations = state.addedRotations.map((a) => normAngle(a + 90));
    [...$("grid").children].forEach((c, i) => applyCardVisual(c, i));
  };

  $("resetBtn").onclick = () => {
    state.addedRotations = new Array(state.addedRotations.length).fill(0);
    [...$("grid").children].forEach((c, i) => applyCardVisual(c, i));
    toast("Döndürme açıları sıfırlandı.");
  };

  async function renderGrid() {
    const grid = $("grid");
    grid.innerHTML = "";
    const doc = state.doc;
    const renders = [];

    for (let i = 0; i < doc.numPages; i++) {
      const pNo = i + 1;
      const card = document.createElement("div");
      card.className = "card";

      const top = document.createElement("div");
      top.className = "card-top";
      top.innerHTML = `<span>Sayfa ${pNo}</span><span class="angle-pill">0°</span>`;

      const thumbBox = document.createElement("div");
      thumbBox.className = "thumb-box";
      const cv = document.createElement("canvas");
      thumbBox.appendChild(cv);

      const row = document.createElement("div");
      row.className = "rot-row";

      const leftBtn = document.createElement("button");
      leftBtn.type = "button";
      leftBtn.className = "rot-btn";
      leftBtn.textContent = "↺ Sola";
      leftBtn.title = "90° sola döndür";
      leftBtn.onclick = () => rotatePage(i, -90);

      const rightBtn = document.createElement("button");
      rightBtn.type = "button";
      rightBtn.className = "rot-btn";
      rightBtn.textContent = "↻ Sağa";
      rightBtn.title = "90° sağa döndür";
      rightBtn.onclick = () => rotatePage(i, 90);

      const flipBtn = document.createElement("button");
      flipBtn.type = "button";
      flipBtn.className = "rot-btn";
      flipBtn.textContent = "180°";
      flipBtn.title = "180° çevir";
      flipBtn.onclick = () => rotatePage(i, 180);

      row.append(leftBtn, rightBtn, flipBtn);
      card.append(top, thumbBox, row);
      applyCardVisual(card, i);
      grid.appendChild(card);
      renders.push({ pNo, cv });
    }

    for (const r of renders) {
      if (doc !== state.doc) return;
      const page = await doc.getPage(r.pNo);
      const baseVp = page.getViewport({ scale: 1 });
      const scale = 150 / Math.max(baseVp.width, baseVp.height);
      const vp = page.getViewport({ scale });
      const dpr = window.devicePixelRatio || 1;
      r.cv.width = Math.floor(vp.width * dpr);
      r.cv.height = Math.floor(vp.height * dpr);
      await page.render({
        canvasContext: r.cv.getContext("2d"),
        viewport: page.getViewport({ scale: scale * dpr })
      }).promise;
    }
  }

  $("saveBtn").onclick = async () => {
    if (!state.bytes) return;
    const btn = $("saveBtn");
    btn.disabled = true;
    btn.textContent = "Kaydediliyor…";

    try {
      const pdfDoc = await PDFDocument.load(state.bytes);
      const pages = pdfDoc.getPages();

      pages.forEach((page, idx) => {
        const finalAngle = normAngle((state.baseRotations[idx] || 0) + (state.addedRotations[idx] || 0));
        page.setRotation(degrees(finalAngle));
      });

      const outBytes = await pdfDoc.save();
      const url = URL.createObjectURL(new Blob([outBytes], { type: "application/pdf" }));
      const a = document.createElement("a");
      a.href = url;
      a.download = `${state.name}-dondurulmus.pdf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      toast("Döndürülmüş PDF hazır, indirme başladı.");
    } catch (err) {
      toast("PDF kaydedilemedi: " + (err.message || "hata"), true);
    } finally {
      btn.disabled = false;
      btn.textContent = "Kaydet ve İndir";
    }
  };
</script>
</body>
</html>
